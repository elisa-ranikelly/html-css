<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Grid Layout</title>
    <style>

        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .container{
            width: 100vw;
            height: 100vh;

            display: grid;
            grid-template-rows: 80px 40px 1fr 60px;
            grid-template-columns: 1fr 150px;
            gap: 8px;
        }

        .topo{
            border: 2px solid black;
            background-color: lightgray;
            text-align: center;
            padding-top: 5px;

            grid-row-start: 1;
            grid-row-end: 2;

            grid-column-start: 1;
            grid-column-end: 3;
        }

        .menu{
            border: 2px solid black;
            background-color: lightgray;
            text-align: center;
            padding-top: 5px;

            grid-row-start: 2;
            grid-row-end: 3;

            grid-column-start: 1;
            grid-column-end: 3;
        }

        .principal{
            border: 2px solid black;
            background-color: lightgray;
            text-align: center;
            padding-top: 5px;

            grid-row-start: 3;
            grid-row-end: 3;

            grid-column-start: 1;
            grid-column-end: 2;
        }

        .secundario{
            border: 2px solid black;
            background-color: lightgray;
            text-align: center;
            padding-top: 5px;

            grid-row-start: 3;
            grid-row-end: 3;

            grid-column-start: 2;
            grid-column-end: 3;
        }

        .rodape{
            border: 2px solid black;
            background-color: lightgray;
            text-align: center;
            padding-top: 5px;
            
            grid-row-start: 4;
            grid-row-end: 5;

            grid-column-start: 1;
            grid-column-end: 3;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="topo">Topo</div>
        <div class="menu">Menu</div>
        <div class="principal">Principal</div>
        <div class="secundario">Secundário</div>
        <div class="rodape">Rodapé</div>
    </div>
</body>
</html>
