<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-box</title>
    <style>
        div.container{
            background-color: bisque;
            display: flex;
            flex-flow: row nowrap;
        }

        div.conteudo{
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <h1>Primeiros passos com Flex-box</h1>
    <div class="container">
        <div class="conteudo">A</div>
        <div class="conteudo">Conteúdo grande</div>
        <div class="conteudo">C</div>
        <div class="conteudo">Conteúdo bem maior</div>
        <div class="conteudo">E</div>
        <div class="conteudo">F</div>
        <div class="conteudo">Conteúdo extremamente grande</div>
        <div class="conteudo">H</div>
    </div>
</body>
</html>
