<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-box</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        h1, h2{
            text-align: center;
        }

        body{
            background-color: lightsalmon;
        }

        main{
            background-color: lightgreen;
            height: 100vh;
            width: 100vw;
            
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }
        section{
            background-color: lightslategray;
            width: 300px;
            height: 300px;
        }
    </style>
</head>
<body>
    <h1>Centralização absoluta</h1>
    <main>
        <section>
            <h2>Tela Login</h2>
        </section>
    </main>
</body>
</html>
