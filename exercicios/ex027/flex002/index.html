<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-box</title>
    <style>
        div.container{
            background-color: bisque;
            display: flex;
            
            /*flex-direction: row;
            flex-direction: column;
            flex-direction: column-reverse;
            flex-direction: row-reverse;*/
            
            /*flex-wrap: wrap;
            flex-wrap: nowrap;
            flex-wrap: wrap-reverse;*/

            flex-flow: row wrap
        }

        div.conteudo{
            background-color: aqua;
            border: 1px solid black;
            padding: 10px;
            text-align: center;

            flex: auto;
        }
    </style>
</head>
<body>
    <h1>Primeiros passos com Flex-box</h1>
    <div class="container">
        <div class="conteudo">Exemplo de bloco A</div>
        <div class="conteudo">Exemplo de bloco B</div>
        <div class="conteudo">Exemplo de bloco C</div>
        <div class="conteudo">Exemplo de bloco D</div>
        <div class="conteudo">Exemplo de bloco E</div>
    </div>
</body>
</html>
