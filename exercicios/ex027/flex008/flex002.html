<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-box</title>
    <style>
        div.container{
            background-color: bisque;
            display: flex;
            flex-flow: row nowrap;
        }

        div.conteudo{
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
        }

        #a{
            flex: 1 0 200px
        }

        #b{
            flex: 0 0 200px
        }

        #c{
            flex: 1 0 200px
        }
    </style>
</head>
<body>
    <h1>Primeiros passos com Flex-box</h1>
    <div class="container">
        <div class="conteudo" id="a">A</div>
        <div class="conteudo" id="b">B</div>
        <div class="conteudo" id="c">C</div>
        
    </div>
</body>
</html>
